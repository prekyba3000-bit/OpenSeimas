<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atviras Seimas</title>
    <!--
      Open Graph tags are static (site-level only).
      Per-route OG is not feasible with HashRouter because the server always
      serves this file regardless of the hash fragment.
      TODO(v4): if routing migrates to HTML5 history mode + SSR/SSG, per-route
      OG tags can be generated at build time.
      TODO(v4): add og:image (site logo/screenshot) and og:url once deployment
      domain is confirmed
    -->
    <meta property="og:site_name" content="Atviras Seimas" />
    <meta property="og:title" content="Atviras Seimas" />
    <meta
      property="og:description"
      content="Atviras ir nepriklausomas Seimo narių skaidrumo stebėjimo įrankis."
    />
    <meta property="og:type" content="website" />
    <meta
      name="description"
      content="Atviras ir nepriklausomas Seimo narių skaidrumo stebėjimo įrankis."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Atviras Seimas" />
    <meta
      name="twitter:description"
      content="Atviras ir nepriklausomas Seimo narių skaidrumo stebėjimo įrankis."
    />
    <!--
      Fonts are self-hosted (Inter, via @fontsource in main.jsx) so the packaged
      app makes no request to Google. Cinzel and JetBrains Mono were declared
      here but never applied — the CSS vars that would use them
      (--font-terminal / --font-decree) are undefined, so only Inter ever
      rendered. Removed rather than self-hosted: no point bundling unused fonts.
    -->
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // Mirrors src/lib/theme.ts; kept deliberately tiny and dependency-free.
      (function () {
        try {
          var stored = localStorage.getItem('openseimas-theme');
          var dark = stored === 'dark' ||
            (stored !== 'light' &&
             window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) { /* storage blocked; the app applies the theme on mount */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
