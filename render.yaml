# Render.com Blueprint — MONOREPO ROOT version.
# Replaces Seimas.v2/render.yaml, which still points at the retired standalone
# Seimas.v2 repo. Delete the old file after adopting this one.
#
# ⚠️  OPERATIONS WARNING (learned the hard way, outage of 2026-07→08):
# Render's FREE PostgreSQL EXPIRES 30 days after creation — that is what took the
# API down and lost all ingested data. The DB now lives on Neon (persistent free
# tier, us-west-2 to match the service region); DB_DSN is set manually in the
# Render console (sync: false below). Do NOT re-add a `databases:` block on the
# free plan. Still pending: nightly pg_dump backups (db_backup.yml needs the
# DB_DSN repo secret) — until those run, the DB is the only copy of the data.

services:
  - type: web
    name: seimas-api
    runtime: docker
    plan: free          # free web services sleep on idle → expect ~15s cold starts;
                        # pair with an uptime monitor hitting /health every 5 min
    rootDir: Seimas.v2  # Dockerfile lives here; build context = Seimas.v2/
    repo: https://github.com/prekyba3000-bit/OpenSeimas
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DB_DSN
        sync: false     # set manually in the console (Neon DSN); never in git
      - key: SYNC_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11"
