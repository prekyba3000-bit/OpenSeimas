# Render.com Blueprint — MONOREPO ROOT version.
# Replaces Seimas.v2/render.yaml, which still points at the retired standalone
# Seimas.v2 repo. Delete the old file after adopting this one.
#
# ⚠️  OPERATIONS WARNING (learned the hard way, outage of 2026-07→08):
# Render's FREE PostgreSQL EXPIRES 30 days after creation — that is what took the
# API down. Either upgrade seimas-db to a paid plan, or move the DB to a provider
# with a persistent free tier (Neon, Supabase) and set DB_DSN manually instead of
# fromDatabase. Whichever you choose: schedule nightly pg_dump backups (e.g. a
# GitHub Actions cron uploading to Backblaze) — the DB is currently the only copy
# of months of ingested data.

databases:
  - name: seimas-db
    plan: free          # ← see warning above; free tier EXPIRES
    databaseName: seimas
    user: seimas

services:
  - type: web
    name: seimas-api
    runtime: docker
    plan: free          # free web services sleep on idle → expect ~15s cold starts;
                        # pair with an uptime monitor hitting /health every 5 min
    rootDir: Seimas.v2  # Dockerfile lives here; build context = Seimas.v2/
    repo: https://github.com/prekyba3000-bit/OpenSeimas
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DB_DSN
        fromDatabase:
          name: seimas-db
          property: connectionString
      - key: SYNC_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11"
