[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["Seimas.v2/tests"]
pythonpath = ["Seimas.v2"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
