# CI — gates every PR and push to main.
# Lives at the MONOREPO ROOT (.github/workflows/) — GitHub ignores workflows in
# subdirectories (this was OpenSeimas issue #3; do not move this file under Seimas.v2/).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seimas
          POSTGRES_PASSWORD: seimas
          POSTGRES_DB: seimas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seimas" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: pip install -r Seimas.v2/requirements.txt
      - name: Apply schema + all migrations to a fresh DB
        working-directory: Seimas.v2
        env:
          DB_DSN: postgresql://seimas:seimas@localhost:5432/seimas
        run: python3 apply_migrations.py
      - name: Backend tests
        working-directory: Seimas.v2
        env:
          PYTHONPATH: .
          DB_DSN: postgresql://seimas:seimas@localhost:5432/seimas
        run: python -m pytest tests -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 24 is the current LTS; 20 reached end of life. package.json declares
      # `engines.node >= 22`, which is what the local pre-push hook runs on —
      # CI deliberately runs the newer line so a version-specific break shows
      # up here rather than in a Vercel build.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # Monorepo workspaces: root package.json includes Seimas.v2/dashboard and
      # packages/*; --legacy-peer-deps is the documented install path (README).
      - name: Install
        run: npm ci --legacy-peer-deps
      # Vite transpiles regardless of type errors, so nothing else here would
      # have failed on one. No exclusions: the three vendored shadcn/ui
      # adapters that used to need them are deleted.
      - name: Type check
        run: npm run dashboard:typecheck
      - name: Unit tests (vitest, single run in CI)
        # config.ts throws without VITE_API_URL; tests execute it at import time.
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run dashboard:test
      # The same variable the tests get. Vite inlines it at build time, and
      # config.ts throws at module load without it — so a build without it
      # succeeds here and the deployed app dies on first paint. The build was
      # the one step not given it.
      - name: Build
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run dashboard:build
      # Proves the bundle it just built actually starts. A build that produces
      # a module-load crash is the failure the missing variable would cause,
      # and nothing above would notice it.
      - name: Built app starts
        env:
          VITE_API_URL: http://localhost:8000
        run: node .github/scripts/smoke-built-app.mjs
